[platformio]
default_envs = firmware

[env]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
; Edgent uses NimBLE-Arduino; the framework BLE library conflicts with it.
lib_ignore = BLE
lib_deps =
    adafruit/Adafruit SHT4x Library@^1.0.5
    blynkkk/Blynk@1.4.0
    https://github.com/Blynk-Technologies/Edgent-Arduino.git#v0.9.0
    bblanchon/ArduinoJson@7.4.3
    arduino-libraries/ArduinoHttpClient@0.6.2
    h2zero/NimBLE-Arduino@2.5.1
    mathertel/OneButton@2.6.2

[env:firmware]